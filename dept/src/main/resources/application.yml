spring:
  application:
    name: dept
  # 数据库连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dept_demo
    username: root
    password: root
    type: com.zaxxer.hikari.HikariDataSource

mybatis:
  # mapper xml文件位置
  mapper-locations: com/hyz/dept/mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.hyz.dept.entity
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志

